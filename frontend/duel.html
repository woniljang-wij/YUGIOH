<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yu-Gi-Oh! H5 — Bàn đấu</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/card-frame.css">
<link rel="stylesheet" href="css/duel.css">
</head>
<body class="duel">

<!-- ============================================================
     ẢNH NỀN BÀN ĐẤU
     👉 Bỏ file vào:  backend/assets/images/backgrounds/bg-duel.jpg
     (chưa có ảnh thì tự động dùng nền gradient bên dưới)
     ============================================================ -->
<div class="bg-image bg-image--duel" aria-hidden="true"></div>

<div class="bg-layer"></div>
<div class="bg-grid"></div>

<div class="rotate-hint" role="status" aria-live="polite">
  <div class="rotate-hint__card">
    <div class="rotate-hint__device" aria-hidden="true"></div>
    <p class="rotate-hint__eyebrow">TRẬN ĐẤU TOÀN MÀN HÌNH</p>
    <h1>Hãy xoay ngang thiết bị</h1>
    <p>Bàn đấu sẽ hiển thị đầy đủ và dễ thao tác hơn ở chế độ ngang.</p>
  </div>
</div>

<div class="wrap">

  <!-- ================= HUD TRÊN ================= -->
  <header class="hud">
    <div class="pinfo" data-js="pinfo-me">
      <div class="avatar">🧑<span class="avatar__lvl">Lv.4</span></div>
      <div class="pinfo__body">
        <div class="pinfo__row">
          <span class="pinfo__name">CốtNgoàiChg</span>
          <span class="pinfo__lp" data-js="lp-me">8.000</span>
        </div>
        <div class="bar bar--hp" data-js="lpbar-me"><i style="width:100%"></i></div>
      </div>
    </div>

    <div class="hud__spacer"></div>

    <div class="phases" data-js="phases"></div>

    <div class="turnflag" data-js="turn-flag">Lượt 1</div>

    <div class="hud__spacer"></div>

    <div class="pinfo" data-js="pinfo-opp">
      <div class="pinfo__body">
        <div class="pinfo__row">
          <span class="pinfo__lp" data-js="lp-opp">8.000</span>
          <span class="pinfo__name">Đối thủ</span>
        </div>
        <div class="bar bar--hp" data-js="lpbar-opp"><i style="width:100%"></i></div>
      </div>
      <div class="avatar">😈<span class="avatar__lvl">Lv.6</span></div>
    </div>

    <button class="icon-btn" data-js="btn-log" title="Nhật ký">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h10M7 13h10M7 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- ================= BÀN ĐẤU ================= -->
  <main class="board">
    <canvas id="cocosDuelCanvas" width="960" height="640" aria-label="Bàn đấu Cocos2d Canvas"></canvas>
    <div class="cocos-error" data-js="cocos-error" role="status" hidden></div>

    <!-- --- phía đối thủ --- -->
    <section class="side side--opp">
      <div class="rail">
        <div class="slot slot--extra" data-soon>
          <div>EXTRA<b data-js="extra-opp">0</b></div>
        </div>
        <div class="slot slot--deck" data-js="deck-opp" data-soon>
          <div>BỘ BÀI<b>40</b></div>
        </div>
        <div class="slot slot--grave" data-soon>
          <i class="slot__badge is-zero" data-js="grave-badge-opp">0</i>
          <div>MỘ<b data-js="grave-opp">0</b></div>
        </div>
      </div>
      <div class="side__field">
        <div class="row">
          <div class="zone" data-zone="opp-mon-0"></div>
          <div class="zone" data-zone="opp-mon-1"></div>
          <div class="zone" data-zone="opp-mon-2"></div>
          <div class="zone" data-zone="opp-mon-3"></div>
          <div class="zone" data-zone="opp-mon-4"></div>
        </div>
        <div class="row">
          <div class="zone zone--st" data-zone="opp-st-0"></div>
          <div class="zone zone--st" data-zone="opp-st-1"></div>
          <div class="zone zone--st" data-zone="opp-st-2"></div>
          <div class="zone zone--st" data-zone="opp-st-3"></div>
          <div class="zone zone--st" data-zone="opp-st-4"></div>
        </div>
      </div>
    </section>

    <div class="midline"><span class="midline__label">Duel Field</span></div>

    <!-- --- phía người chơi --- -->
    <section class="side side--me">
      <div class="side__field">
        <div class="row">
          <div class="zone" data-zone="me-mon-0"></div>
          <div class="zone" data-zone="me-mon-1"></div>
          <div class="zone" data-zone="me-mon-2"></div>
          <div class="zone" data-zone="me-mon-3"></div>
          <div class="zone" data-zone="me-mon-4"></div>
        </div>
        <div class="row">
          <div class="zone zone--st" data-zone="me-st-0"></div>
          <div class="zone zone--st" data-zone="me-st-1"></div>
          <div class="zone zone--st" data-zone="me-st-2"></div>
          <div class="zone zone--st" data-zone="me-st-3"></div>
          <div class="zone zone--st" data-zone="me-st-4"></div>
        </div>
      </div>
      <div class="rail">
        <div class="slot slot--extra" data-soon>
          <div>EXTRA<b data-js="extra-me">0</b></div>
        </div>
        <div class="slot slot--deck" data-js="deck-me" data-soon>
          <div>BỘ BÀI<b>40</b></div>
        </div>
        <div class="slot slot--grave" data-soon>
          <i class="slot__badge is-zero" data-js="grave-badge-me">0</i>
          <div>MỘ<b data-js="grave-me">0</b></div>
        </div>
      </div>
    </section>
  </main>

  <div class="hand hand--opponent"><div data-js="hand-opp"></div></div>

  <!-- ================= TAY BÀI + ĐIỀU KHIỂN ================= -->
  <section class="hud hud--bottom">
    <button class="btn btn--sm" data-js="btn-draw" aria-label="Rút bài">🃏<span>Rút bài</span></button>
    <button class="btn btn--sm" data-js="btn-auto" aria-label="Tự động đặt bài">⚡<span>Tự động</span></button>

    <div class="hand">
      <div class="hand__list" data-js="hand-me"></div>
    </div>

    <button class="btn btn--gold" data-js="btn-end">⏭ Kết thúc lượt</button>
  </section>
</div>

<audio id="duelMusic" preload="auto" aria-hidden="true"></audio>

<!-- ================= NHẬT KÝ ================= -->
<aside class="log panel" data-js="log">
  <div class="panel__head">📜 Nhật ký trận đấu</div>
  <div class="log__list" data-js="log-list"></div>
</aside>

<!-- ================= KẾT THÚC ================= -->
<div class="result" data-js="result">
  <div class="result__box">
    <h2 class="result__title" data-js="result-title">CHIẾN THẮNG</h2>
    <p class="result__lp" data-js="result-lp">LP còn lại: 8.000</p>
    <div class="result__actions">
      <button class="btn btn--gold" data-js="btn-rematch">🔁 Đấu lại</button>
      <button class="btn" data-js="btn-exit">🏠 Về sảnh</button>
    </div>
  </div>
</div>

<script src="js/bg.js"></script>
<script src="js/card-art.js"></script>
<script src="js/card-frame.js"></script>
<script src="js/card-back.js?v=3"></script>
<script src="js/cards.js"></script>
<script src="js/cocos-motion.js"></script>
<script src="js/game-scheduler.js"></script>
<script src="js/cocos-duel-engine.js"></script>
<script src="js/duel-music.js"></script>
<script src="js/duel.js"></script>
</body>
</html>
